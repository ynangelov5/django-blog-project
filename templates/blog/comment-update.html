{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Edit Comment{% endblock %}

{% block content %}
  <h3>Edit Comment</h3>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'post-detail' comment.post.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
